limit_req_zone $binary_remote_addr zone=reads:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=shares:1m rate=5r/m;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 4k;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    gzip on;
    gzip_types text/css application/javascript application/json;

    location = /health/live { access_log off; default_type application/json; return 200 '{"status":"live"}'; }
    location = /release.json { alias /etc/stellar/release.json; add_header Cache-Control no-store; }
    location = /version.json { add_header Cache-Control no-store; }
    # Explicit allowlist keeps docs, metrics, internal positions and maintenance private.
    location ~ "^/api/catalog/(v1/(meta|snapshots/active|snapshots/[a-z0-9][a-z0-9-]{0,95}(/stars(/[0-9]{1,20}|/sun)?(/neighbors)?|/ordinals/[0-9]+|/map|/chunks/[0-9]{6}\.bin)?))$" {
        limit_except GET { deny all; }
        limit_req zone=reads burst=60 nodelay;
        rewrite ^/api/catalog/(.*)$ /$1 break;
        proxy_pass http://catalog:8000;
    }
    location = /api/journey/v1/estimate {
        limit_except POST { deny all; }
        limit_req zone=reads burst=20 nodelay;
        proxy_pass http://journey:8000/v1/estimate;
    }
    location = /api/journey/v1/journeys {
        limit_except POST { deny all; }
        limit_req zone=shares burst=5 nodelay;
        proxy_pass http://journey:8000/v1/journeys;
    }
    location = /api/journey/v1/meta {
        limit_except GET { deny all; }
        proxy_pass http://journey:8000/v1/meta;
    }
    location ~ "^/api/journey/v1/journeys/[a-fA-F0-9-]{36}$" {
        limit_except GET { deny all; }
        limit_req zone=reads burst=30 nodelay;
        rewrite ^/api/journey/(.*)$ /$1 break;
        proxy_pass http://journey:8000;
    }
    location /api/ { return 404; }
    location /health/ { return 404; }
    location ~ "^/(metrics|docs|redoc|openapi\.json|admin|import|migrate)(/|$)" { return 404; }
    location / { limit_except GET { deny all; } try_files $uri $uri/ /index.html; }
}
