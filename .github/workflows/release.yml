name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stellar-atlas-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'Jyot-Kikani/DevOps_Assignment' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
      checks: read
    steps:
      - name: Check out successful main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Set up frozen Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.5'
      - name: Install hashed operations dependencies
        run: python -m pip install --require-hashes -r tools/locks/ops.txt -r tools/locks/journey.txt
      - name: Download verified data, build, scan, publish, promote latest main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release.py publish
      - name: Retain concise release and scan metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: release-evidence
          path: |
            .local/published-release.json
            .local/reports/release/scan-summary.json
            .local/reports/release/grype-*.json
            .local/reports/release/grype-*.log
            .local/reports/release/*.log
          retention-days: 3
          if-no-files-found: ignore
