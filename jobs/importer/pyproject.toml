[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"
[project]
name = "stellar-importer"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = ['stellar-common==0.1.0', 'SQLAlchemy==2.1.5', 'alembic==1.20.0', 'psycopg[binary]==3.3.6', 'httpx==0.28.1']
[tool.setuptools.packages.find]
where = ["src"]
